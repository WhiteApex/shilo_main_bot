[tool.poetry]
name = "shilo-main-bot"
version = "0.1.0"
description = "Telegram bot for online events marketing campaign"
authors = ["Shilo Bot Team <team@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
aiogram = "^3.4.1"
SQLAlchemy = "^2.0.25"
aiosqlite = "^0.19.0"
apsscheduler = "^3.10.4"
pydantic = "^2.6.1"
python-dotenv = "^1.0.1"
uvloop = { version = "^0.19.0", optional = true }
sentry-sdk = "^1.40.0"
pandas = "^2.2.0"
python-dateutil = "^2.8.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.3.0"
pytest = "^8.0.2"

[tool.poetry.extras]
uvloop = ["uvloop"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
